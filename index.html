<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.min.js"></script>
<script>
  // ---- Point this at your running RATS server ----
  const SERVER_URL = "https://rats-server-js-6dhr.onrender.com";
  // --------------------------------------------------

  const statPlayers = document.getElementById('stat-players');
  const statRooms = document.getElementById('stat-rooms');
  const roomList = document.getElementById('room-list');

  const statsSocket = io(SERVER_URL, {
    transports: ['websocket'],
    reconnection: true,
  });

  statsSocket.on('connect', () => {
    roomList.innerHTML = '<p class="no-rooms">no active rooms</p>';
  });

  statsSocket.on('connect_error', () => {
    statPlayers.textContent = '?';
    statRooms.textContent = '?';
    roomList.innerHTML = '<p class="no-rooms">offline</p>';
  });

  statsSocket.on('disconnect', () => {
    statPlayers.textContent = '?';
    statRooms.textContent = '?';
    roomList.innerHTML = '<p class="no-rooms">disconnected</p>';
  });

  statsSocket.on('server_stats', (data) => {
    statPlayers.textContent = data.connected_players;
    statRooms.textContent = data.room_count;

    const roomNames = Object.keys(data.rooms || {});

    if (roomNames.length === 0) {
      roomList.innerHTML = '<p class="no-rooms">no active rooms</p>';
      return;
    }

    roomList.innerHTML = roomNames.map((roomName) => {
      const playerIds = data.rooms[roomName] || [];
      const roomPlayers = data.rooms_data && data.rooms_data[roomName] ? data.rooms_data[roomName] : {};
      const usernames = playerIds.map((id) => (roomPlayers[id] && roomPlayers[id].username) || 'player');
      return `<p class="room-entry">${escapeHtml(roomName)} (${playerIds.length}) — ${escapeHtml(usernames.join(', '))}</p>`;
    }).join('');
  });

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = String(str);
    return div.innerHTML;
  }
</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
  // ---- Fill in your panorama filenames here ----
  const panoramaFiles = [
    'bellyban_office.png',
    'bunker.png',
    'testmap.png',
    'backrooms.png'
  ];
  // -----------------------------------------------

  const randomFile = panoramaFiles[Math.floor(Math.random() * panoramaFiles.length)];
  const panoramaPath = 'panoramas/' + randomFile;

  const canvas = document.getElementById('panorama-bg');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });

  // Cap pixel ratio — this is the #1 cause of freezes/slowdowns on high-res
  // monitors, since devicePixelRatio can be 2-3x and multiplies render cost.
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
  renderer.setSize(window.innerWidth, window.innerHeight);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
  camera.position.set(0, 0, 0);

  // Sphere with texture on the INSIDE. Lower segment counts than a typical
  // demo (48x32 instead of 60x40) — plenty smooth for a full-screen bg,
  // cheaper on the GPU.
  const geometry = new THREE.SphereGeometry(500, 48, 32);
  geometry.scale(-1, 1, 1); // flip so texture faces inward

  const loader = new THREE.TextureLoader();
  loader.load(
    panoramaPath,
    (texture) => {
      // Constrain texture size so a huge source PNG (e.g. 8K) doesn't choke
      // decode/upload. Three r128 doesn't auto-downscale, so we do it here
      // via an offscreen canvas if the image is larger than we need.
      const maxDim = 4096;
      if (texture.image && (texture.image.width > maxDim || texture.image.height > maxDim)) {
        const scale = maxDim / Math.max(texture.image.width, texture.image.height);
        const canvasEl = document.createElement('canvas');
        canvasEl.width = texture.image.width * scale;
        canvasEl.height = texture.image.height * scale;
        const ctx = canvasEl.getContext('2d');
        ctx.drawImage(texture.image, 0, 0, canvasEl.width, canvasEl.height);
        texture.image = canvasEl;
        texture.needsUpdate = true;
      }

      texture.minFilter = THREE.LinearFilter; // avoids mipmap generation cost
      texture.generateMipmaps = false;

      const material = new THREE.MeshBasicMaterial({ map: texture });
      const sphere = new THREE.Mesh(geometry, material);
      scene.add(sphere);
      animate();
    },
    undefined,
    (err) => {
      console.error('Failed to load panorama:', panoramaPath, err);
    }
  );

  // Slowly rotate the camera to look around
  let lon = 0;
  function animate() {
    requestAnimationFrame(animate);

    lon += 0.01; // rotation speed — increase/decrease to taste
    const phi = THREE.MathUtils.degToRad(90);
    const theta = THREE.MathUtils.degToRad(lon);

    const target = new THREE.Vector3(
      500 * Math.sin(phi) * Math.cos(theta),
      500 * Math.cos(phi),
      500 * Math.sin(phi) * Math.sin(theta)
    );
    camera.lookAt(target);

    renderer.render(scene, camera);
  }

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  // ---- OS detection for download button ----
  function detectOS() {
    const platform = navigator.userAgent || navigator.platform || '';
    if (/Mac/i.test(platform)) return 'mac';
    if (/Linux/i.test(platform) && !/Android/i.test(platform)) return 'linux';
    if (/Win/i.test(platform)) return 'windows';
    return 'windows'; // fallback
  }

  const os = detectOS();
  const osIcon = document.getElementById('os-icon');
  const osLabel = document.getElementById('os-label');

  const osConfig = {
    windows: { icon: 'fa-windows', label: 'Download for Windows' },
    mac:     { icon: 'fa-apple',   label: 'Download for Mac' },
    linux:   { icon: 'fa-linux',   label: 'Download for Linux' }
  };

  osIcon.classList.add(osConfig[os].icon);
  osLabel.textContent = osConfig[os].label;
</script>
